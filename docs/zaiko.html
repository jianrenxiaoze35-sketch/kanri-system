<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<title>現場入力｜商品管理システム</title>
<style>
/* v11 在庫入力アプリ（2026-10-31）。商品管理システムの派生アプリ。品目はマスタから選ぶだけ。入力は同じスプレッドシートの「tana」「現場入力」に保存 */
:root{
  /* テーマは緑と白（端末がダークモードでも同じ） */
  color-scheme:light;
  --bg:#fff; --panel:#fff; --sunk:#eef6f1; --ink:#16291f; --mute:#55695e; --line:#cfe0d6;
  --accent:#2C7259; --accent-ink:#fff; --accent-soft:#dcefe4;
  --ok:#2C7259; --ok-soft:#dcefe4; --warn:#8a5a00; --warn-soft:#f6e8c8; --bad:#b3362c; --bad-soft:#f6dcd9;
  --tap:44px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  padding:0 max(14px,env(safe-area-inset-left,0px)) 80px max(14px,env(safe-area-inset-right,0px))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:0 0 12px 12px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
header b{font-size:19px;letter-spacing:.04em}
header a{color:var(--accent-ink);font-weight:700;text-decoration:none;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
[hidden]{display:none!important}
.bar label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
select,input[type=search]{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;min-height:var(--tap)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{color:var(--mute);font-size:13px}
h2{font-size:17px;margin:18px 0 6px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-top:10px;overflow-x:auto}
.tabs button{white-space:nowrap;border:0;background:none;padding:10px 14px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700}
.chips button[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px}
.loc{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.loc .n{font-weight:700;font-size:16px}
.loc .m{grid-column:1/-1;color:var(--mute);font-size:12px;display:flex;justify-content:space-between}
.loc.done{border-left:5px solid var(--ok)} .loc.part{border-left:5px solid var(--warn)} .loc.unset{border-style:dashed}
.chip{display:inline-flex;align-self:start;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--mute);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:8px}
.item{padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.counted{background:color-mix(in srgb,var(--ok-soft) 50%,transparent)}
.item .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.item .sub{color:var(--mute);font-size:12px}
.conv{margin-top:6px;font-size:13px;background:var(--sunk);border-radius:8px;padding:4px 10px;display:inline-block}
.conv b{font-size:14px}
.ins{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px}
.in{display:flex;align-items:center;gap:4px}
.in button{width:var(--tap);height:var(--tap);border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:20px;font-weight:700;cursor:pointer}
.in input{width:76px;height:var(--tap);text-align:right;border:2px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;font-size:18px;font-variant-numeric:tabular-nums}
.in input:focus{border-color:var(--accent)}
.in input.gk{border-color:var(--warn);background:var(--warn-soft)}
.note.gchk{font-size:14px}
.in input.gh{border-color:var(--bad);background:var(--bad-soft)}
.note.gbig{font-size:14px;background:var(--bad-soft);color:var(--bad)}
.in .u{font-size:18px;font-weight:700;min-width:2em}
.total{margin-top:6px;font-size:14px}
.total b{font-size:17px;font-variant-numeric:tabular-nums}
.note{margin-top:6px;font-size:12.5px;border-radius:8px;padding:5px 10px;background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.foot{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:10px}
.status{font-size:12px;color:var(--mute)}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.ph .th{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--sunk)}
.ph .th img{width:100%;height:100%;object-fit:cover;display:block}
.ph .th button{position:absolute;top:2px;right:2px;width:24px;height:24px;border-radius:999px;border:0;background:rgb(0 0 0 / .6);color:#fff;font-weight:700;cursor:pointer;line-height:1}
.ph label.btn{display:inline-flex;align-items:center;gap:6px}
.phlinks a{font-weight:700;margin-right:8px}
.status.err{color:var(--bad);font-weight:700}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);width:min(560px,calc(100vw - 24px));padding:0}
dialog::backdrop{background:rgb(10 20 26 / .45)}
.dh{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.db{max-height:55vh;overflow:auto}
.df{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.pick{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 14px;cursor:pointer}
.pick:hover{background:var(--sunk)}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:8px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--sunk);color:var(--mute);font-size:12px}
td.r,th.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;z-index:20;max-width:calc(100vw - 32px)}
.loading{padding:40px 0;text-align:center;color:var(--mute)}
.ukeh{font-size:14px;margin:0 0 6px}
.uin{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 10px;max-width:100%}
.uin.num{width:84px;text-align:right}
.chk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px dashed var(--line)}
.chk:first-of-type{border-top:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);min-width:56px;min-height:40px;font-weight:700;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true].g{background:var(--accent);color:#fff}
.seg button[aria-pressed=true].b{background:var(--bad);color:#fff}
.verdict{border-radius:10px;padding:10px 12px}
.verdict b{font-size:18px}
.v-ok{background:var(--ok-soft)} .v-warn{background:var(--warn-soft)} .v-bad{background:var(--bad-soft)} .v-none{background:var(--sunk)}
</style>

<script>

    }
    if (p.action === 'tanaTheory') return { ok:true, diffOpen:(mockDb.diff ? mockDb.diff.filter(function(o){ return o.state !== '対応済'; }).length : 2), rows:[{table:'原料',id:'m:x',name:'見本の原料',start:'2026-11-04',startQty:10,inn:6,prepUse:0,sold:0,used:1,out:0,val:15,unit:'袋',counted:null,diff:null,warn:''}], warnings:['見本の警告'], salesUntil:'2026-10-30', at:at, hasStart:true };
    if (p.action === 'tanaTheoryStart') return { ok:true, saved:1 };

    if (p.action === 'tanaPlace'){ mockDb.locRows.push({id:p.id, loc:p.loc, op:p.op}); return { ok:true }; }
    if (p.action === 'tanaDone'){ mockDb.doneRows.push({round:p.round, k:p.dept+'|'+p.loc, by:p.staff, at:at, undo:p.undo}); return { ok:true }; }
    if (p.action === 'tanaState'){
      var counts = {}, locs = JSON.parse(JSON.stringify(mockDb.seedLocs || {})), done = {};
      mockDb.rows.forEach(function(x){ if (x.round !== p.round) return; var k = x.r.id + '|' + x.r.loc; if (x.r.v === null) delete counts[k]; else counts[k] = {v:x.r.v, small:x.r.small, detail:x.r.detail, by:x.by, at:x.at}; });
      mockDb.locRows.forEach(function(x){ var l = locs[x.id] || (locs[x.id] = []); var i = l.indexOf(x.loc); if (x.op === 'del'){ if (i >= 0) l.splice(i, 1); } else if (i < 0) l.push(x.loc); });
      mockDb.doneRows.forEach(function(x){ if (x.round !== p.round) return; if (x.undo) delete done[x.k]; else done[x.k] = {by:x.by, at:x.at}; });
      return { ok:true, counts:counts, locs:locs, done:done };
    }
    return { ok:false, error:'mock' };
  });

var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(n){ return (Math.round(n * 1000) / 1000).toLocaleString('ja-JP', {maximumFractionDigits:3}); }

/* ---- 棚卸の月：20日以降は今月、それより前は先月を初期値にする ---- */

/* ---- 単位 ----
   units は大きい順（例：箱→本→ml）。per＝その単位1つが最小単位いくつか。在庫の単位（stockLv）で数を保存する */
function stockUnit(it){ return it.units.filter(function(u){ return u.lv === it.stockLv; })[0] || it.units[0]; }
function smallest(it){ return it.units[it.units.length - 1]; }
/* ---- 重さは kg で入れる（2026-11-21 小沢さん：在庫入力の単位を kg に統一。1kg 未満は g に直して確かめる）----
   保存する数（在庫の単位の数・最小単位の数）は商品管理のマスタの単位のまま（g の品目は g）。原価・レシピ・理論在庫の計算は変えない。
   画面に出す単位と入れる単位だけ、g を kg に読み替える */
function isG(name){ return /^(g|ｇ|グラム)$/.test(String(name || '').trim()); }
function un(u){ return isG(u.u) ? 'kg' : u.u; }      // 画面の単位名
function uf(u){ return isG(u.u) ? 1000 : 1; }         // 画面の1単位が、マスタの単位いくつか
function kv(v, unit){ return (v === null || v === undefined || v === '') ? v : isG(unit) ? v / 1000 : v; }  // 記録の数（マスタの単位）を画面の単位に
function ku(unit){ return isG(unit) ? 'kg' : unit; }
function numU(n, name){ return name === 'kg' ? (Math.round(n * 10000) / 10000).toLocaleString('ja-JP', {maximumFractionDigits:4}) : num(n); }  // kg は 0.1g まで
function qtyU(v, u){ return numU(v / uf(u), un(u)) + ' ' + un(u); }  // u の単位でいくつ、を画面の単位で
function gOf(kg){ return (Math.round(kg * 10000) / 10).toLocaleString('ja-JP') + ' g'; }
function gText(kg){ return numU(kg, 'kg') + ' kg ＝ ' + gOf(kg); }
function wUnit(it){   // 重さの欄（品目に重さの単位が無く、1つの重さが登録されているとき）
  if (!(it.gPer > 0) || it.units.some(function(u){ return un(u) === 'kg'; })) return null;
  return {lv:'重', u:'kg', per:1000 / it.gPer, w:true};
}
function inUnits(it){ if (!it._iu){ var w = wUnit(it); it._iu = w ? it.units.concat([w]) : it.units; } return it._iu; }
function singleNote(u){
  return un(u) === 'kg' ? '<div class="note info">この品目は kg で数えます。1kg に足りない分は 0.35 のように小数で入れてください（g に直して下に出します）。</div>'
    : '<div class="note info">この品目の一番小さい単位は「' + esc(u.u) + '」です。開いている分は 0.5' + esc(u.u) + ' のように小数で入れてください。</div>';
}
function convText(it){
  if (inUnits(it).length < 2) return '';
  var parts = [];
  for (var i = 0; i < it.units.length - 1; i++){
    var a = it.units[i], b = it.units[i+1], n = a.per * uf(a) / (b.per * uf(b));
    parts.push('1' + esc(un(a)) + ' ＝ <b>' + numU(n, un(b)) + esc(un(b)) + '</b>' + (un(b) === 'kg' && n < 1 ? '（' + gOf(n) + '）' : ''));
  }
  if (wUnit(it)){ var sm0 = it.units[it.units.length - 1], kg0 = it.gPer / 1000; parts.push('1' + esc(sm0.u) + ' ＝ <b>' + numU(kg0, 'kg') + 'kg</b>' + (kg0 < 1 ? '（' + gOf(kg0) + '）' : '')); }
  return parts.join('　／　');
}
function locsOf(it){
  var l = (it.locs || []).slice();
  (S.locs[it.id] || []).forEach(function(x){ if (l.indexOf(x) < 0) l.push(x); });
  return l;
}
// 一覧に出す品目：原料・資材・半製品マスタの全品目と、棚卸対象の商品
function listed(it){ return !it.hidden; }
function counted(it){ var c = false; Object.keys(S.counts).forEach(function(k){ if (k.indexOf(it.id + '|') === 0) c = true; }); return c; }
function deptList(){ var m = {}; items.forEach(function(it){ if (listed(it)) m[it.dept || 'その他'] = (m[it.dept || 'その他'] || 0) + 1; }); return m; }
function locMap(dept){
  var m = {};
  items.forEach(function(it){
    if (!listed(it) || (it.dept || 'その他') !== dept) return;
    var ls = locsOf(it); if (!ls.length) ls = [UNSET];
    ls.forEach(function(l){ (m[l] = m[l] || []).push(it); });
  });
  var order = LOCS.concat([UNSET]);
  return Object.keys(m).sort(function(a, b){
    var ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 900 : ia) - (ib < 0 ? 900 : ib) || a.localeCompare(b, 'ja');
  }).map(function(k){ return [k, m[k]]; });
}

/* ---- 読み込み ---- */
function setStatus(t, err){ var s = $('#status'); s.textContent = t; s.className = 'status' + (err ? ' err' : ''); }
function loadState(){
  return call({action:'tanaState', round:round}).then(function(j){

    Object.keys(pending).forEach(function(k){ var r = pending[k]; if (r.round !== round) return; if (r.v === null) delete S.counts[k]; else S.counts[k] = {v:r.v, small:r.small, detail:r.detail, by:staff, at:new Date().toISOString()}; });
    setStatus('最新 ' + hhmm(new Date().toISOString()));

}
Promise.all([
  call({action:'staff'}).then(function(j){

]).then(function(){

});
setInterval(function(){ if (view.tab === 'count' && !view.loc && !Object.keys(pending).length) loadState().then(function(){ if (!view.loc) render(); }); }, 60000);

/* ---- 送る（失敗しても入力は消さず、次の入力のときと30秒ごとに送り直す） ---- */
var flushing = false;
function flush(){
  if (flushing) return;
  var keys = Object.keys(pending); if (!keys.length) return;
  flushing = true;
  var byRound = {};
  keys.forEach(function(k){ var r = pending[k]; (byRound[r.round] = byRound[r.round] || []).push(r); });
  var jobs = Object.keys(byRound).map(function(rd){
    var rows = byRound[rd], who = rows[0].staff;
    return call({action:'tanaPut', round:rd, staff:who, route:'在庫入力アプリ/棚卸', rows:rows}).then(function(j){
      if (!j || !j.ok) throw new Error((j && j.error) || '保存できませんでした');
      rows.forEach(function(r){ if (pending[r.id + '|' + r.loc] === r) delete pending[r.id + '|' + r.loc]; });
    });
  });
  Promise.all(jobs).then(function(){ setStatus('保存しました ' + hhmm(new Date().toISOString())); })
    .catch(function(e){ setStatus('未送信 ' + Object.keys(pending).length + '件（電波の良い所で自動で送り直します）：' + e.message, true); })
    .then(function(){ flushing = false; markRows(); });
}
setInterval(flush, 30000);
window.addEventListener('beforeunload', function(e){ if (Object.keys(pending).length){ e.preventDefault(); e.returnValue = ''; } });

/* ---------------- 数える ---------------- */
function render(){

    '<div class="locs">' + lm.map(function(x){

      var chip = d ? '<span class="chip ok">完了</span>' : c ? '<span class="chip warn">途中</span>' : loc === UNSET ? '<span class="chip">置き場所を決める</span>' : '<span class="chip">未着手</span>';
      return '<button class="loc ' + cls + '" data-loc="' + esc(loc) + '"><span class="n">' + esc(loc) + '</span>' + chip +
        '<span class="m"><span>' + c + ' / ' + list.length + '品目</span><span>' + (d ? esc(d.by) + ' ' + hhmm(d.at) : '') + '</span></span></button>';
    }).join('') + '</div>' +
    '<p class="hint" style="margin-top:12px">「場所未設定」は、商品管理システムで保管場所が入っていない品目です。数えた場所を選ぶと、次からその場所に出ます。</p>';
  [].forEach.call(document.querySelectorAll('[data-dept]'), function(b){ b.onclick = function(){ view.dept = b.dataset.dept; store('tana.dept', view.dept); render(); }; });
  [].forEach.call(document.querySelectorAll('[data-loc]'), function(b){ b.onclick = function(){

function itemRow(it, loc){
  var key = it.id + '|' + loc, c = S.counts[key];
  var su = stockUnit(it), sm = smallest(it);
  var vals = (c && c.detail) ? parseDetail(it, c.detail) : {};
  var ins = inUnits(it).map(function(u, i){
    var id = 'q_' + i + '_' + it.id.replace(/[^\w]/g, '_') + '_' + loc.length;
    return '<div class="in"><button type="button" aria-label="' + esc(un(u)) + 'を1減らす" data-step="-1" data-i="' + i + '">−</button>' +
      '<input id="' + id + '" inputmode="decimal" data-i="' + i + '" aria-label="' + esc(it.name) + 'の' + esc(un(u)) + 'の数" value="' + (vals[i] != null ? vals[i] : '') + '" placeholder="0">' +
      '<button type="button" aria-label="' + esc(un(u)) + 'を1増やす" data-step="1" data-i="' + i + '">＋</button><span class="u">' + esc(un(u)) + '</span></div>';
  }).join('');
  var single = inUnits(it).length === 1;
  return '<div class="item' + (c ? ' counted' : '') + '" data-id="' + esc(it.id) + '">' +
    '<div class="nm">' + esc(it.name) + '</div>' +
    '<div class="sub">' + esc([it.bunrui, it.sub, it.maker].filter(Boolean).join('・')) + (c ? '　✓ ' + esc(c.by) + ' ' + hhmm(c.at) : '') + '</div>' +
    (single ? '' : '<div class="conv">' + convText(it) + '</div>') +
    '<div class="ins">' + ins + '</div>' +
    '<div class="total" data-total></div>' +
    (single ? singleNote(sm) : '<div class="note" data-frac hidden></div>') +
    (loc === UNSET ? '<div class="bar"><select data-place aria-label="置き場所">' + LOCS.map(function(l){ return '<option>' + esc(l) + '</option>'; }).join('') + '</select><button class="btn small" data-placebtn>この場所に置く</button></div>'
      : '<div style="margin-top:6px"><button class="btn small" data-notHere>この場所には置いていない</button></div>') +
  '</div>';
}
// 保存した内訳（例「2箱 3本」）を入力欄に戻す
function parseDetail(it, detail){
  var out = {};
  String(detail).split(/\s+/).forEach(function(p){
    inUnits(it).forEach(function(u, i){
      var nm = un(u), k = 1;
      if (p.slice(-nm.length) !== nm){
        if (isG(u.u) && p.slice(-u.u.length) === u.u && p.slice(-2) !== 'kg'){ nm = u.u; k = 1 / 1000; } else return;  // 前の「350g」
      }
      var n = parseFloat(p.slice(0, -nm.length)); if (!isNaN(n)) out[i] = Math.round(n * k * 1e6) / 1e6;
    });
  });
  return out;
}
function readRow(it, row){
  var small = 0, any = false, parts = [], frac = null, light = [], heavy = [];
  [].forEach.call(row.querySelectorAll('input[data-i]'), function(inp){

  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){
      var k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);

var theory = {table:'原料', confirm:false, onlyWarn:false};
var DIFF_TAB = '差分の記録';
function renderTheory(){
  $('#app').innerHTML = '<div class="loading">計算しています…</div>';
  call({action:'tanaTheory'}).then(function(j){
    if (!j || !j.ok) throw new Error((j && j.error) || '計算できませんでした');
    if (view.tab !== 'theory') return;
    theory.data = j; drawTheory();
  }).catch(function(e){ $('#app').innerHTML = '<div class="note">計算できませんでした：' + esc(e.message) + '</div>'; });
}

  };
}
/* ---------------- 差分の記録（棚卸の数と、数えた日の理論値の差に気づいて対応した記録。シート「棚卸差分」） ---------------- */
function diffChip(n){ return '<button id="ttDiff" aria-pressed="' + (theory.table === DIFF_TAB) + '">' + DIFF_TAB + (n ? ' <span class="chip bad">未対応 ' + n + '</span>' : '') + '</button>'; }
function bindDiffChip(){ $('#ttDiff').onclick = function(){ theory.table = DIFF_TAB; renderDiff(); }; }
function renderDiff(){
  $('#app').innerHTML = '<div class="loading">計算しています…</div>';
  call({action:'tanaDiffList', round:round}).then(function(j){
    if (!j || !j.ok) throw new Error((j && j.error) || '読み込めませんでした');
    if (view.tab !== 'theory' || theory.table !== DIFF_TAB) return;
    theory.diff = j; drawDiff();
  }).catch(function(e){ $('#app').innerHTML = '<div class="note">読み込めませんでした：' + esc(e.message) + '</div>'; });
}
function diffOptions(list, v, blank){ return (blank ? '<option value="">' + blank + '</option>' : '') + list.map(function(o){ return '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join(''); }
function diffToday(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function drawDiff(){
  var j = theory.diff, tabs = ['原料','仕込み品','チェストストッカー'], sign = function(v){ return (v > 0 ? '+' : '') + num(v); };
  var behind = j.rows.some(function(r){ return j.salesUntil && r.day && r.day > j.salesUntil; });
  $('#app').innerHTML = '<div class="chips">' + tabs.map(function(t){ return '<button data-tt="' + t + '" aria-pressed="false">' + t + '</button>'; }).join('') + diffChip(j.open) + '</div>' +
    '<h2>差分の記録 <span class="hint">' + esc($('#round').selectedOptions[0].textContent) + '</span></h2>' +
    '<p class="hint" style="margin:0">棚卸の数と、数えた日の閉店後の理論値の差です。差がある行は原因を選びます。差額1,000円以上、ずれ20%以上、要冷蔵の差がある行は、対応内容・対応者・対応日も入れて「対応済」にします。未対応が残る月は締めません。原因が分からないときは「原因不明」を選びます。判断に迷うときは責任者へ。責任者が不在のときは企画推進室へ。</p>' +
    (behind ? '<div class="note">売上の取り込みが ' + esc(j.salesUntil) + ' までです。数えた日までの売上が入ると差が変わるので、取り込んでから見てください。</div>' : '') +
    (j.rows.length ? '<div class="list">' + j.rows.map(function(r, i){
      var d = r.draft || (r.draft = {cause:r.cause, action:r.action, who:r.who || staff, when:r.when || diffToday(), state:r.state === '未対応' ? '対応済' : r.state});
      var moved = r.recDiff !== null && r.recDiff !== r.diff;
      return '<div class="item" data-i="' + i + '"><div class="nm">' + esc(r.name) + ' ' +
        (r.need === '対応まで' ? '<span class="chip bad">対応まで</span>' : r.need === '原因のみ' ? '<span class="chip warn">原因を選ぶ</span>' : '<span class="chip">差なし</span>') + ' ' +
        (r.state === '対応済' ? '<span class="chip ok">対応済</span>' : r.state === '確認中' ? '<span class="chip warn">確認中</span>' : '') + '</div>' +
        '<div class="sub">棚卸 ' + (r.counted === null ? '—' : num(kv(r.counted, r.unit))) + ' ／ ' + esc(String(r.day || '').slice(5).replace('-', '/')) + 'の理論値 ' + (r.valAt === null ? '—' : num(kv(r.valAt, r.unit))) + ' ／ 差 <b>' + (r.diff === null ? '—' : sign(kv(r.diff, r.unit))) + '</b> ' + esc(ku(r.unit)) + (r.yen ? ' ／ 差額 ' + yen(r.yen) : '') + (r.why.length ? '（' + esc(r.why.join('・')) + '）' : '') + '</div>' +
        (moved ? '<div class="note">記録したときの差は ' + sign(kv(r.recDiff, r.unit)) + esc(ku(r.unit)) + ' でした。数え直しや売上の取り込みで変わっています。</div>' : '') +
        (r.need === '不要' ? '<div class="sub">原因：' + esc(r.cause) + (r.action ? '／' + esc(r.action) : '') + '</div>' :
        '<div class="bar"><label>差分原因 <select class="uin" data-f="cause">' + diffOptions(j.causes, d.cause, '選ぶ') + '</select></label>' +
        (r.need === '対応まで' ? '<label>対応状況 <select class="uin" data-f="state">' + diffOptions(j.states, d.state) + '</select></label><label>対応者 <input class="uin" data-f="who" maxlength="40" value="' + esc(d.who) + '"></label><label>対応日 <input class="uin" data-f="when" type="date" value="' + esc(d.when) + '"></label></div><div class="bar"><input class="uin" style="flex:1" data-f="action" maxlength="500" placeholder="対応内容（是正したことを1行で）" aria-label="対応内容" value="' + esc(d.action) + '">' : '') +
        '<button class="btn small pri" data-save="' + i + '">' + (r.at ? '直す' : '記録する') + '</button></div>') +
        (r.at ? '<div class="sub">' + esc(hhmm(r.at)) + ' ' + esc(r.by) + ' が記録</div>' : '') + '</div>';
    }).join('') + '</div>' : '<p class="hint" style="margin-top:10px">' + (j.hasStart ? 'この棚卸で差のある品目はありません（数のない品目、開始数のない品目は対象外です）。' : '開始数が入るまで、差は出ません。') + '</p>');
  [].forEach.call(document.querySelectorAll('[data-tt]'), function(b){ b.onclick = function(){ theory.table = b.dataset.tt; renderTheory(); }; });
  bindDiffChip();
  [].forEach.call(document.querySelectorAll('.item [data-f]'), function(el){
    el.oninput = el.onchange = function(){ j.rows[el.closest('.item').dataset.i].draft[el.dataset.f] = el.value; };
  });
  [].forEach.call(document.querySelectorAll('[data-save]'), function(b){ b.onclick = function(){
    var r = j.rows[b.dataset.save], d = r.draft;
    if (!staff){ toast('先に「数える人」で自分の名前を選んでください'); return; }
    if (!d.cause){ toast('差分原因を選んでください'); return; }
    if (r.need === '対応まで' && d.state === '対応済' && !(d.action.trim() && d.who.trim() && d.when)){ toast('対応内容・対応者・対応日を入れてください'); return; }
    b.disabled = true;
    call({action:'tanaDiffSave', round:round, staff:staff, route:'在庫入力アプリ', row:{id:r.id, cause:d.cause, action:d.action, who:d.who, when:d.when, state:d.state}}).then(function(res){
      if (!res || !res.ok) throw new Error(res && res.error === 'no_diff' ? '差がなくなっています。読み直してください' : res && res.error === 'need_action' ? '対応内容・対応者・対応日を入れてください' : ((res && res.error) || ''));
      j.rows[b.dataset.save] = res.row; j.open = res.open; if (theory.data) theory.data.diffOpen = res.open;
      toast('記録しました'); drawDiff();
    }).catch(function(e){ b.disabled = false; toast('記録できませんでした：' + e.message); });
  }; });
}
$('#tabMove').onclick = function(){ view.tab = 'move'; move.pick = null; render(); };
$('#tabTheory').onclick = function(){ view.tab = 'theory'; flush(); render(); };

/* ---------------- 品目（商品管理システムのマスタを見るだけ） ---------------- */
function renderMaster(){
  $('#app').innerHTML = '<h2>品目マスタ <span class="hint">' + items.length + '品目</span></h2>' +
    '<p class="hint" style="margin:0">商品管理システムのマスタです。品目の追加や修正は責任者へ。責任者が不在のときは企画推進室へ。<a href="https://docs.google.com/spreadsheets/d/1zB6-J1I5nqpSqcoKyM_jhCNjZxCi41dO7xff68Ttn84/edit" target="_blank" rel="noopener">スプレッドシート</a>は権限のある人だけ開けます。</p>' +
    '<div class="bar"><input id="mQ" type="search" placeholder="品名・メーカー・分類で探す" style="flex:1" autocomplete="off"></div><div class="tbl"><table><thead><tr><th>品目</th><th>部門・分類</th><th>単位</th><th>保管場所</th></tr></thead><tbody id="mBody"></tbody></table></div><p class="hint" id="mNote"></p>';
  var draw = function(){
    var q = $('#mQ').value.trim().toLowerCase();
    var hits = items.filter(function(i){ return !q || (i.name + ' ' + i.maker + ' ' + i.sub + ' ' + i.bunrui + ' ' + i.dept).toLowerCase().indexOf(q) >= 0; });
    $('#mBody').innerHTML = hits.slice(0, 100).map(function(i){
      return '<tr><td>' + esc(i.name) + '</td><td>' + esc([i.dept, i.bunrui, i.sub].filter(Boolean).join('・')) + '</td><td>' + (inUnits(i).length > 1 ? convText(i) : esc(un(i.units[0]))) + '</td><td>' + esc(locsOf(i).join('、') || '未設定') + '</td></tr>';
    }).join('');
    $('#mNote').textContent = hits.length > 100 ? '先頭の100品目を表示しています。絞り込んでください。' : '';
  };
  $('#mQ').oninput = draw; draw();
}
$('#tabSum').onclick = function(){ view.tab = 'sum'; flush(); loadState().then(render); };
</script>
